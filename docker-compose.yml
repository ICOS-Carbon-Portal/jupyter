networks:
  jupyter:
    driver: bridge
    name: jupyter

services:

  hub:
    build:
      context: ./hub
      dockerfile: Dockerfile
    command: jupyterhub -f /srv/jupyterhub/jupyterhub_config.py
    container_name: hub
    environment:
      JUPYTERHUB_CRYPT_KEY: "mycryptkey"
    image: hub:latest
    networks:
      - jupyter
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./hub/jupyterhub_config.py:/srv/jupyterhub/jupyterhub_config.py
      - ./templates:/srv/jupyterhub/templates

  icosbase:
    build:
      context: ./icosbase
      dockerfile: Dockerfile
    container_name: icosbase
    deploy:
      replicas: 0
    image: icosbase:latest
    networks:
      - jupyter

  explore-icos-atmobs:
    build:
      context: nb-content/explore-icos-atmobs
      dockerfile: ../Dockerfile
    deploy:
      replicas: 0
    image: explore-icos-atmobs:latest
    networks:
      - jupyter
    restart: on-failure

  curve-fitting-obspack:
    build:
      context: nb-content/curve-fitting-obspack
      dockerfile: ../Dockerfile
    deploy:
      replicas: 0
    image: curve-fitting-obspack:latest
    networks:
      - jupyter
    restart: on-failure

  radiocarbon:
    build:
      context: nb-content/radiocarbon
      dockerfile: ../Dockerfile
    deploy:
      replicas: 0
    image: radiocarbon:latest
    networks:
      - jupyter
    restart: on-failure
