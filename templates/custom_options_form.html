<div class="container text-center my-4">
    <p class="mb-4">Please choose one of the available notebook environments:</p>

    <div class="d-flex justify-content-center gap-5 mb-4">
        <div class="form-check">
            <input class="form-check-input" type="radio" name="env" id="pylib" value="pylib-examples:latest" required>
            <label class="form-check-label fw-bold" for="pylib">Pylib Examples</label>
        </div>

        <div class="form-check">
            <input class="form-check-input" type="radio" name="env" id="core" value="core-notebooks:latest" required>
            <label class="form-check-label fw-bold" for="core">Core Notebooks</label>
        </div>
    </div>
</div>
